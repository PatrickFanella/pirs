[package]
name = "pirs-sandbox-fixture"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
# Qualification-only negative fixture: std's panic support adds WASI imports.
wasi = []
event-echo = []

[dependencies]
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2.12", features = ["global"] }
