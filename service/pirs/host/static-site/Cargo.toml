[package]
name = "pirs-static-site"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2.12", features = ["global"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
