[package]
name = "pirs-plugin-host"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pirs-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
wasmtime = { version = "=39.0.1", default-features = false, features = ["cranelift", "runtime", "component-model", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
