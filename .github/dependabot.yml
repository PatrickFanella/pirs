version: 2

updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      docker-base-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are reviewed by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Stay on LTS Node 24. Node 25 is EOL; Node 26 reaches LTS on 2026-10-28.
      # Remove via bluesky-social/.github#18.
      - dependency-name: node
        versions:
          - ">= 25"

  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/monitoring"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      compose-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are reviewed by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # The application image is released by this repository.
      - dependency-name: ghcr.io/bluesky-social/pds
