name: Pirs smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: service
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Smoke check
        working-directory: service
        run: pnpm smoke
