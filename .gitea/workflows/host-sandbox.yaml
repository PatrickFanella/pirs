name: WIT host sandbox

on:
  push:
    paths:
      - service/pirs/host/**
      - service/pirs/events/**
      - service/pirs/bridge.ts
      - service/index.ts
      - service/package.json
      - service/pnpm-lock.yaml
      - docs/qualification/plugin-host.md
      - docs/qualification/event-delivery.md
      - docs/qualification/manifest-install.md
      - docs/spec/local-manifest.md
      - docs/spec/kv-storage.md
      - docs/qualification/kv-storage.md
      - .gitea/workflows/host-sandbox.yaml
  pull_request:
    paths:
      - service/pirs/host/**
      - service/pirs/events/**
      - service/pirs/bridge.ts
      - service/index.ts
      - service/package.json
      - service/pnpm-lock.yaml
      - docs/qualification/plugin-host.md
      - docs/qualification/event-delivery.md
      - docs/qualification/manifest-install.md
      - docs/spec/local-manifest.md
      - docs/spec/kv-storage.md
      - docs/qualification/kv-storage.md
      - .gitea/workflows/host-sandbox.yaml

jobs:
  qualify:
    runs-on: dozor
    container: rust:1.95.0-bookworm
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Install action runtime and Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates curl
          curl --fail --location --output /tmp/pirs-host-node.tar.xz https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
          echo '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647  /tmp/pirs-host-node.tar.xz' | sha256sum --check
          tar -C /usr/local --strip-components=1 -xf /tmp/pirs-host-node.tar.xz
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build host and hostile WIT fixtures
        working-directory: service/pirs/host
        run: |
          rustup target add wasm32-wasip2
          rustup component add rustfmt
          cargo fmt --all --check
          python3 build.py
      - name: Qualify limits, isolation and recovery
        working-directory: service/pirs/host
        run: python3 qualify.py
      - name: Qualify manifest imports, startup and integrity
        working-directory: service/pirs/host
        run: python3 qualify-manifest.py
      - name: Qualify durable plugin state and operator commands
        working-directory: service/pirs/host
        run: |
          cargo test -p pirs-plugin-host --locked
          python3 qualify-kv.py
      - name: Install event qualification dependencies
        working-directory: service
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check event delivery types
        working-directory: service
        run: pnpm check:events
      - name: Qualify installed consumer filtering and cursor integrity
        working-directory: service
        run: node --test pirs/events/manifest.test.ts pirs/events/kv.test.ts
      - name: Qualify event delivery, restarts and stopped-host writes
        working-directory: service
        run: pnpm qualify:events
